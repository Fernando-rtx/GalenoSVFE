<!doctype html>
<html lang="es">
  <meta charset="utf-8"><title>Instalación PWA — fixture sintético</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/resources/estilos/galenos.css">
  <body>
    <button id="volver">Volver</button><output id="resultado">EJECUTANDO</output>
    <script type="module">
      import { offerTicketDownload } from '/js/boundary/ticket-options.js';
      import { installationInstructions, requestInstallation } from '/js/boundary/pwa.js';
      const assert = (ok, message) => { if (!ok) throw new Error(message); };
      const until = async (fn) => {
        for (let n = 0; n < 100; n++) {
          if (fn()) return;
          await new Promise(resolve => setTimeout(resolve, 10));
        }
        throw new Error('No llegó el resultado esperado');
      };
      // Simula la API del navegador; no instala una app ni conecta con el backend.
      let prompts = 0;
      function available(choice) {
        const event = new Event('beforeinstallprompt', { cancelable: true });
        event.prompt = async () => { prompts++; };
        event.userChoice = Promise.resolve({ outcome: choice });
        window.dispatchEvent(event);
      }
      try {
        assert(installationInstructions({ userAgent: 'Macintosh Version/26 Safari/605' }).includes('Archivo → Añadir al Dock'), 'No guía la instalación de Safari en Mac');
        assert(installationInstructions({ userAgent: 'iPhone Safari/605' }).includes('Compartir → Añadir a pantalla de inicio'), 'No guía la instalación en iPhone');
        assert(installationInstructions({ userAgent: 'Macintosh Safari/605', maxTouchPoints: 5 }).includes('pantalla de inicio'), 'Confunde un iPad con un Mac');
        assert(!installationInstructions({ userAgent: 'Macintosh Chrome/130 Safari/537' }).includes('Archivo → Añadir al Dock'), 'Da instrucciones de Safari a Chrome');
        assert(installationInstructions({ userAgent: 'Macintosh Chrome/130 Safari/537' }).includes('Enviar, guardar y compartir → Instalar página como aplicación'), 'No guía la instalación de Chrome en escritorio');
        assert(installationInstructions({ userAgent: 'Android Chrome/130 Safari/537' }).includes('Chrome para Android'), 'Confunde Chrome Android con escritorio');
        assert(installationInstructions({ userAgent: 'iPhone CriOS/130 Mobile Safari/605' }).includes('Chrome para iPhone'), 'Confunde Chrome iOS con Safari');
        assert(installationInstructions({ userAgent: 'Windows NT 10.0 Firefox/146' }).includes('icono de aplicaciones web de la barra de direcciones'), 'No guía Firefox Windows');
        assert(installationInstructions({ userAgent: 'Macintosh Firefox/146' }).includes('Firefox para Mac no ofrece instalación nativa'), 'Promete instalación nativa en Firefox Mac');
        assert(installationInstructions({ userAgent: 'X11; Linux x86_64 Firefox/146' }).includes('abre esta misma dirección en Chrome'), 'No ofrece alternativa para Firefox Linux');
        assert(installationInstructions({ userAgent: 'Android Firefox/146' }).includes('Firefox para Android, abre el menú ⋮ → Instalar'), 'No guía Firefox Android');
        assert(installationInstructions({ userAgent: 'iPhone FxiOS/146 Mobile Safari/605' }).includes('Firefox para iPhone'), 'Confunde Firefox iOS con Safari');
        assert(!installationInstructions({ userAgent: 'Windows Chrome/130 Safari/537 Edg/130' }).includes('En Chrome,'), 'Confunde Edge con Chrome');
        assert(installationInstructions({ userAgent: '' }).includes('El navegador no ha ofrecido'), 'No conserva ayuda para un navegador desconocido');
        document.querySelector('#volver').focus();
        const pdf = offerTicketDownload();
        document.querySelector('[data-ticket-install]').click();
        await until(() => document.querySelector('[data-install-status]').textContent.length > 0);
        assert(!document.querySelector('[data-install-status]').textContent.includes('Instalación solicitada'), 'Finge éxito sin aviso disponible');
        document.querySelector('[data-ticket-pdf]').click();
        assert(await pdf === true, 'La instalación impide descargar el PDF');
        assert(document.activeElement.id === 'volver', 'No devuelve el foco');

        available('accepted');
        const accepted = offerTicketDownload();
        const button = document.querySelector('[data-ticket-install]');
        button.click(); button.click();
        await until(() => document.querySelector('[data-install-status]').textContent.includes('Instalación solicitada'));
        assert(prompts === 1 && button.disabled, 'Abre dos avisos por doble clic');
        assert(await requestInstallation() === 'unavailable', 'Reutiliza un aviso consumido');
        document.querySelector('[data-ticket-cancel]').click();
        assert(await accepted === false, 'Solicita PDF al cancelar');

        available('dismissed');
        const dismissed = offerTicketDownload();
        document.querySelector('[data-ticket-install]').click();
        await until(() => document.querySelector('[data-install-status]').textContent.includes('cancelada'));
        assert(!document.querySelector('[data-ticket-install]').disabled, 'Bloquea el botón tras cancelar');
        document.querySelector('[data-ticket-cancel]').click();
        await dismissed;

        window.dispatchEvent(new Event('appinstalled'));
        const installed = offerTicketDownload();
        assert(document.querySelector('[data-ticket-install]').disabled && document.querySelector('[data-ticket-install]').textContent === 'App instalada', 'Ignora la confirmación appinstalled');
        document.querySelector('[data-ticket-cancel]').click();
        await installed;
        document.querySelector('#resultado').textContent = 'PASS: instalación sintética — aviso único, cancelación, confirmación, guía Safari/Chrome/Firefox por dispositivo y PDF independiente';
      } catch (error) {
        document.querySelector('#resultado').textContent = 'FAIL: ' + error.message;
        console.error(error);
      }
    </script>
  </body>
</html>
